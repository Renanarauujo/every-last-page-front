<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Every Last Page</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="side" aria-labelledby="search-title">
      <div class="brand"><img src="img/logo.png" alt="" width="30" height="30"><b>Every Last Page</b></div>
      <h2 id="search-title" class="sr">Buscar livros</h2>
      <form id="search-form" class="search-form" novalidate>
        <input id="search-q" type="search" placeholder="Título, autor ou ISBN" aria-label="Termo da busca" minlength="2" maxlength="100" autocomplete="off">
        <div class="qf">
          <select id="search-field" aria-label="Buscar em"><option value="all">Tudo</option><option value="title">Título</option><option value="author">Autor</option><option value="isbn">ISBN</option></select>
          <select id="search-language" aria-label="Idioma"><option value="any">Idioma</option><option value="por">Português</option><option value="eng">Inglês</option><option value="spa">Espanhol</option><option value="fre">Francês</option></select>
          <select id="search-sort" aria-label="Ordem"><option value="relevance">Relevância</option><option value="new">Mais recentes</option><option value="old">Mais antigos</option></select>
        </div>
        <button id="search-btn" type="submit" class="search-btn"></button>
      </form>
      <p id="results-info" class="info"></p>
      <ul id="results" class="results"></ul>
    </aside>

    <div class="splitter" data-col="side" role="separator" aria-orientation="vertical" aria-label="Largura da busca" tabindex="0" title="Arraste para ajustar. Duplo clique volta ao padrão."></div>

    <main class="board-wrap">
      <div class="board-head">
        <h1>Minha estante</h1>
        <input id="shelf-filter" type="search" placeholder="Filtrar por título ou autor" aria-label="Filtrar a estante" autocomplete="off">
        <select id="shelf-order" aria-label="Ordenar a estante">
          <option value="recent">Mais recentes</option><option value="oldest">Mais antigos</option><option value="title">Título</option><option value="rating">Nota</option>
        </select>
      </div>
      <div id="board" class="board"></div>
    </main>

    <div class="splitter" data-col="panel" role="separator" aria-orientation="vertical" aria-label="Largura do painel" tabindex="0" title="Arraste para ajustar. Duplo clique volta ao padrão."></div>

    <aside class="panel" aria-labelledby="panel-title">
      <h2 id="panel-title">Painel</h2>
      <dl id="stats" class="stats"></dl>
      <section>
        <h3>Livros lidos por mês</h3>
        <div id="months" class="chart"></div>
      </section>
      <section>
        <h3>Notas dadas</h3>
        <div id="ratings" class="ratings"></div>
      </section>
    </aside>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
