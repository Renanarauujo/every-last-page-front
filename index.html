<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Every Last Page</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="top">
    <img class="logo" src="img/logo.png" alt="" width="36" height="36">
    <h1>Every Last Page</h1>
    <p>Estante de leitura</p>
  </header>

  <main class="layout">
    <section class="col search-col" aria-labelledby="search-title">
      <h2 id="search-title">Buscar livros</h2>
      <form id="search-form" class="search-form">
        <div class="bar">
          <input id="search-q" type="search" placeholder="Título, autor ou ISBN" aria-label="Termo da busca" minlength="2" maxlength="100" autocomplete="off">
          <button type="submit">Buscar</button>
        </div>
        <div class="filters">
          <label>Buscar em
            <select id="search-field">
              <option value="all">Tudo</option>
              <option value="title">Título</option>
              <option value="author">Autor</option>
              <option value="isbn">ISBN</option>
            </select>
          </label>
          <label>Idioma
            <select id="search-language">
              <option value="any">Qualquer</option>
              <option value="por">Português</option>
              <option value="eng">Inglês</option>
              <option value="spa">Espanhol</option>
              <option value="fre">Francês</option>
            </select>
          </label>
          <label>Ordenar
            <select id="search-sort">
              <option value="relevance">Relevância</option>
              <option value="new">Mais recentes</option>
              <option value="old">Mais antigos</option>
            </select>
          </label>
        </div>
      </form>
      <p id="results-info" class="info"></p>
      <ul id="results" class="results"></ul>
    </section>

    <section class="col shelf-col" aria-label="Estante e painel">
      <section class="shelf-box" aria-labelledby="shelf-title">
        <div class="head">
          <h2 id="shelf-title">Minha estante</h2>
          <select id="shelf-order" aria-label="Ordenar a estante">
            <option value="recent">Mais recentes</option>
            <option value="oldest">Mais antigos</option>
            <option value="title">Título</option>
            <option value="rating">Nota</option>
          </select>
        </div>
        <div id="shelf-tabs" class="tabs" role="tablist" aria-label="Filtrar por status"></div>
        <input id="shelf-filter" class="filter" type="search" placeholder="Filtrar por título ou autor" aria-label="Filtrar a estante" autocomplete="off">
        <div id="shelf" class="shelf"></div>
      </section>

      <section class="panel" aria-labelledby="panel-title">
        <h2 id="panel-title">Painel</h2>
        <div class="panel-body">
          <div id="stats" class="stats"></div>
          <div class="chart-box">
            <h3>Livros lidos por mês</h3>
            <div id="chart" class="chart"></div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
